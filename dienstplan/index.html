<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Dienstplan">
    <meta name="theme-color" content="#0d0d0d">
    <title>Dienstplan</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0d0d0d;
            --bg-secondary: #1a1a1a;
            --bg-card: #242424;
            --bg-input: #2a2a2a;
            --text-primary: #ffffff;
            --text-secondary: #a0a0a0;
            --text-muted: #666666;
            --accent: #c41e3a;
            --accent-glow: rgba(196, 30, 58, 0.3);
            --success: #2ecc71;
            --blue: #3498db;
            --blue-glow: rgba(52, 152, 219, 0.3);
            --border: #333333;
            --radius: 12px;
            --radius-lg: 20px;
            --shadow: 0 4px 24px rgba(0,0,0,0.4);
            --transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); min-height: 100vh; }

        /* HEADER */
        .app-header { position: sticky; top: 0; z-index: 100; background: rgba(13, 13, 13, 0.9); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); padding: 16px 20px; padding-top: max(16px, env(safe-area-inset-top)); border-left: 4px solid #3498db; }
        .header-top { display: flex; align-items: center; gap: 16px; }
        .header-title { font-size: 20px; font-weight: 700; flex: 1; }
        .header-actions { display: flex; gap: 8px; }
        .header-btn { width: 40px; height: 40px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 10px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); }
        .header-btn:hover { background: var(--bg-input); }
        .header-btn svg { width: 20px; height: 20px; fill: var(--text-secondary); }
        .header-sub { margin-top: 8px; font-size: 14px; color: var(--text-secondary); }

        /* DIENSTPLAN */
        .dp-month-nav { display:flex; align-items:center; justify-content:center; gap:12px; margin-bottom:16px; }
        .dp-month-nav button { background:var(--bg-card); border:1px solid var(--border); color:var(--text-primary); width:36px; height:36px; border-radius:50%; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
        .dp-month-nav button:hover { background:var(--accent); color:#000; border-color:var(--accent); }
        .dp-month-nav .dp-month-label { font-size:18px; font-weight:700; min-width:160px; text-align:center; }
        .dp-month-nav .dp-today-btn { background:var(--accent); color:#000; border:none; border-radius:20px; padding:6px 14px; font-size:12px; font-weight:600; cursor:pointer; }
        .dp-table-wrapper { overflow-x:auto; -webkit-overflow-scrolling:touch; border-radius:var(--radius); border:1px solid var(--border); }
        .dp-table { border-collapse:collapse; width:100%; background:var(--bg-card); }
        .dp-table th { background:#3498db; color:white; padding:6px 4px; text-align:center; font-weight:600; font-size:11px; white-space:nowrap; border-right:1px solid rgba(255,255,255,0.15); }
        .dp-table td { padding:6px 4px; border-bottom:1px solid var(--border); border-right:1px solid rgba(255,255,255,0.04); color:var(--text-primary); white-space:nowrap; text-align:center; font-size:11px; }
        .dp-table tr:nth-child(even) { background:var(--bg-secondary); }
        .dp-table tr:hover { background:rgba(52,152,219,0.08); }
        .dp-table td:first-child, .dp-table th:first-child { position:sticky; left:0; z-index:1; background:var(--bg-card); text-align:left; font-weight:600; min-width:90px; border-right:2px solid var(--border); padding:6px 10px; font-size:12px; }
        .dp-table th:first-child { z-index:3; background:#2980b9; }
        .dp-table tr:nth-child(even) td:first-child { background:var(--bg-secondary); }
        .dp-table tr:hover td:first-child { background:rgba(52,152,219,0.12); }
        .dp-today-col { background:rgba(0,212,170,0.18) !important; font-weight:700 !important; }
        .dp-weekend { background:rgba(255,255,255,0.03); color:rgba(255,255,255,0.4) !important; }
        .dp-kw-header { font-size:9px; color:rgba(255,255,255,0.5); font-weight:400; }
        .dp-shift { display:inline-block; padding:2px 6px; border-radius:4px; font-size:10px; font-weight:600; min-width:24px; }
        .dp-shift-fi { background:#2ecc71; color:#000; } .dp-shift-fii { background:#27ae60; color:#fff; }
        .dp-shift-si { background:#3498db; color:#fff; } .dp-shift-ni { background:#9b59b6; color:#fff; }
        .dp-shift-di { background:#e67e22; color:#fff; } .dp-shift-dii { background:#d35400; color:#fff; }
        .dp-shift-gt { background:#1abc9c; color:#000; } .dp-shift-kt { background:#f39c12; color:#000; }
        .dp-shift-ku { background:#8e44ad; color:#fff; } .dp-shift-nst { background:#e74c3c; color:#fff; }
        .dp-shift-sd { background:#2980b9; color:#fff; } .dp-shift-u { background:#95a5a6; color:#000; }
        .dp-shift-eh { background:#e74c3c; color:#fff; } .dp-shift-fobi { background:#16a085; color:#fff; }
        .dp-shift-a { background:#c0392b; color:#fff; } .dp-shift-fzc { background:#7f8c8d; color:#fff; }
        .dp-shift-sek { background:#34495e; color:#fff; } .dp-shift-kur { background:#2c3e50; color:#fff; }
        .dp-legend { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; padding:10px; background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); }
        .dp-legend-item { font-size:10px; display:flex; align-items:center; gap:3px; }
        .dp-drop-active { border-color: #3498db !important; background: rgba(52,152,219,0.08) !important; }
        .dp-sheet-tab { display: inline-block; padding: 8px 16px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; font-weight: 500; color: var(--text-secondary); margin-right: 4px; transition: var(--transition); }
        .dp-sheet-tab.active { background: #3498db; color: white; border-color: #3498db; }
        .dp-sheet-tab:hover:not(.active) { background: var(--bg-input); }

        /* SYNC STATUS */
        .sync-status { font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; margin-top: 4px; }

        /* LIGHT MODE */
        :root.light-mode {
            --bg-primary: #f5f5f5; --bg-secondary: #e8e8e8; --bg-card: #ffffff; --bg-input: #f0f0f0;
            --text-primary: #1a1a1a; --text-secondary: #555555; --text-muted: #888888;
            --border: #d0d0d0; --shadow: 0 4px 24px rgba(0,0,0,0.1);
        }
        .theme-toggle { position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px; border-radius: 50%; background: var(--bg-card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 9998; box-shadow: var(--shadow); transition: var(--transition); }
        .theme-toggle:hover { transform: scale(1.1); }
        .theme-toggle svg { width: 22px; height: 22px; fill: var(--text-secondary); }

        /* OFFLINE */
        .offline-banner { position: fixed; top: 0; left: 0; right: 0; background: linear-gradient(135deg, #e74c3c, #c0392b); color: white; text-align: center; padding: 8px 16px; font-size: 13px; font-weight: 600; z-index: 99999; transform: translateY(-100%); transition: transform 0.3s ease; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .offline-banner.show { transform: translateY(0); }
        .offline-banner svg { width: 16px; height: 16px; fill: white; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.1/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" crossorigin="anonymous" defer></script>
</head>
<body>
    <div class="offline-banner" id="offlineBanner">
        <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4c-1.48 0-2.85.43-4.01 1.17l1.46 1.46C10.21 6.23 11.08 6 12 6c3.04 0 5.5 2.46 5.5 5.5v.5H19c1.66 0 3 1.34 3 3 0 1.13-.64 2.11-1.56 2.62l1.45 1.45C23.16 18.16 24 16.68 24 15c0-2.64-2.05-4.78-4.65-4.96zM3 5.27l2.75 2.74C2.56 8.15 0 10.77 0 14c0 3.31 2.69 6 6 6h11.73l2 2 1.27-1.27L4.27 4 3 5.27zM7.73 10l8 8H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h1.73z"/></svg>
        Offline — Sync pausiert
    </div>

    <header class="app-header">
        <div class="header-top">
            <h1 class="header-title">Dienstplan</h1>
            <div class="header-actions" id="dpUploadBtn">
                <button class="header-btn" onclick="document.getElementById('dpFileInput').click()" title="Excel hochladen" style="background:#3498db;"><svg viewBox="0 0 24 24"><path d="M9 16h6v-6h4l-7-7-7 7h4v6zm-4 2h14v2H5v-2z"/></svg></button>
                <button class="header-btn" id="dpDeleteBtn" onclick="deleteDienstplan()" title="Dienstplan löschen" style="background:#e74c3c;display:none;"><svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg></button>
            </div>
        </div>
        <div class="header-sub">
            <span id="dpUploadInfo">Kein Dienstplan hochgeladen</span>
            <div class="sync-status" id="syncStatus"></div>
        </div>
    </header>

    <input type="file" id="dpFileInput" accept=".xlsx,.xls,.xlsm,.csv" style="display:none;" onchange="handleDienstplanUpload(event)">

    <div style="padding:20px;max-width:900px;margin:0 auto;padding-bottom:80px;">
        <!-- Drag & Drop Zone -->
        <div id="dpDropZone" style="border:2px dashed var(--border);border-radius:16px;padding:40px 20px;text-align:center;margin-bottom:20px;transition:all 0.3s;cursor:pointer;" onclick="document.getElementById('dpFileInput').click()">
            <div style="font-size:48px;margin-bottom:12px;">📋</div>
            <div style="font-size:16px;font-weight:600;color:var(--text-primary);margin-bottom:8px;">Excel-Datei hierher ziehen</div>
            <div style="font-size:13px;color:var(--text-muted);">oder klicken zum Auswählen (.xlsx, .xls, .xlsm, .csv)</div>
        </div>
        <!-- Sheet Tabs -->
        <div id="dpSheetTabs" style="display:none;overflow-x:auto;white-space:nowrap;margin-bottom:16px;padding-bottom:4px;"></div>
        <!-- Month Navigation -->
        <div class="dp-month-nav" id="dpMonthNav" style="display:none;">
            <button onclick="dpChangeMonth(-1)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="currentColor"/></svg></button>
            <div class="dp-month-label" id="dpMonthLabel"></div>
            <button onclick="dpChangeMonth(1)"><svg viewBox="0 0 24 24" width="18" height="18"><path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="currentColor"/></svg></button>
            <button class="dp-today-btn" onclick="dpGoToToday()">Heute</button>
        </div>
        <!-- Table Content -->
        <div id="dpTableContainer"></div>
    </div>

    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Dark/Light Mode">
        <svg id="themeIcon" viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/></svg>
    </button>

    <script>
        // ============ HELPERS ============
        function sanitizeHTML(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
        }

        // ============ SUPABASE ============
        const SUPABASE_URL = 'https://mlocmimpsepzopmqgmtq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im1sb2NtaW1wc2Vwem9wbXFnbXRxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk5Mzg4MTksImV4cCI6MjA4NTUxNDgxOX0.BadecVV6NKnZwqOqHuQ0xBnzL38nv3u72m8ibaLbGVw';

        let supabaseClient = null;
        let isOnline = navigator.onLine;

        function updateSyncStatus(status, text) {
            var el = document.getElementById('syncStatus');
            if (!el) return;
            if (status === 'connected') {
                el.innerHTML = '🟢 ' + (text || 'Cloud verbunden');
                el.style.color = 'var(--success)';
            } else if (status === 'error') {
                el.innerHTML = '🔴 ' + (text || 'Nur lokal');
                el.style.color = '#e74c3c';
            } else {
                el.innerHTML = '🟡 ' + (text || 'Verbinde...');
                el.style.color = '#f59e0b';
            }
        }

        function initSupabase() {
            updateSyncStatus('connecting');
            if (!window.supabase || !window.supabase.createClient) {
                updateSyncStatus('error', 'Library fehlt');
                return false;
            }
            try {
                supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
                updateSyncStatus('connected');
                return true;
            } catch (e) {
                updateSyncStatus('error', 'Init Fehler');
                return false;
            }
        }

        async function cloudGet(table, options) {
            if (!supabaseClient || !isOnline) return null;
            try {
                let query = supabaseClient.from(table).select('*');
                if (options && options.eq) query = query.eq(options.eq[0], options.eq[1]);
                const { data, error } = await query;
                if (error) throw error;
                return data;
            } catch (e) { console.warn('cloudGet:', e.message); return null; }
        }

        async function cloudUpsert(table, data, options) {
            if (!supabaseClient || !isOnline) return;
            try {
                const { error } = await supabaseClient.from(table).upsert(data, options || {});
                if (error) throw error;
            } catch (e) { console.warn('cloudUpsert:', e.message); }
        }

        window.addEventListener('online', function() {
            isOnline = true;
            document.getElementById('offlineBanner').classList.remove('show');
            loadDienstplanFromCloud();
        });
        window.addEventListener('offline', function() {
            isOnline = false;
            document.getElementById('offlineBanner').classList.add('show');
        });

        // ============ REALTIME ============
        function setupRealtime() {
            if (!supabaseClient) return;
            supabaseClient.channel('dp-sync')
                .on('postgres_changes', { event: '*', schema: 'public', table: 'app_kv' }, function() {
                    loadDienstplanFromCloud();
                })
                .subscribe();
        }

        // ============ CLOUD SYNC ============
        async function loadDienstplanFromCloud() {
            if (!supabaseClient || !isOnline) return;
            try {
                var localDp = JSON.parse(localStorage.getItem('mbwd_dienstplan') || 'null');
                var metaRows = await cloudGet('app_kv', { eq: ['key', 'dienstplan_meta'] });
                if (metaRows && metaRows.length > 0) {
                    var metaRow = metaRows[metaRows.length - 1];
                    var cloudMeta = null;
                    try { cloudMeta = JSON.parse(metaRow.value); } catch(e) {}
                    if (cloudMeta && cloudMeta.fileName) {
                        var isNewer = !localDp || !localDp.uploadedAt || new Date(cloudMeta.uploadedAt) > new Date(localDp.uploadedAt);
                        var needsData = !localDp || !localDp.base64;
                        if (needsData || isNewer) {
                            var dataRows = await cloudGet('app_kv', { eq: ['key', 'dienstplan_data'] });
                            if (dataRows && dataRows.length > 0 && dataRows[dataRows.length - 1].value && dataRows[dataRows.length - 1].value.length > 100) {
                                localStorage.setItem('mbwd_dienstplan', JSON.stringify({
                                    fileName: cloudMeta.fileName,
                                    uploadedAt: cloudMeta.uploadedAt,
                                    uploadedBy: cloudMeta.uploadedBy,
                                    sheetNames: cloudMeta.sheetNames,
                                    base64: dataRows[dataRows.length - 1].value
                                }));
                                console.log('Dienstplan aus Cloud geladen:', cloudMeta.fileName);
                                loadSavedDienstplan();
                            }
                        }
                    } else if (!cloudMeta || !cloudMeta.fileName) {
                        localStorage.removeItem('mbwd_dienstplan');
                        dpWorkbook = null; dpParsedData = null; dpViewMonth = null;
                        loadSavedDienstplan();
                    }
                }
            } catch(e) { console.warn('Cloud-Sync Fehler:', e); }
        }

        // ============ DIENSTPLAN ============
        var dpWorkbook = null;
        var dpCurrentSheet = 0;
        var dpParsedData = null;
        var dpViewMonth = null;

        var DP_MONTH_NAMES = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
        var DP_MONTH_FULL = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
        var DP_SHIFT_CLASSES = {
            'fi':'fi','fii':'fii','si':'si','ni':'ni','di':'di','dii':'dii',
            'gt':'gt','kt':'kt','ku':'ku','nst':'nst','sd':'sd','u':'u','u    alt':'u',
            'eh':'eh','fobi':'fobi','a':'a','fzc':'fzc','sek':'sek','kur':'kur','1.at':'fobi'
        };

        function setupDpDragDrop() {
            var zone = document.getElementById('dpDropZone');
            if (!zone) return;
            zone.addEventListener('dragover', function(e) { e.preventDefault(); zone.classList.add('dp-drop-active'); });
            zone.addEventListener('dragleave', function(e) { e.preventDefault(); zone.classList.remove('dp-drop-active'); });
            zone.addEventListener('drop', function(e) {
                e.preventDefault();
                zone.classList.remove('dp-drop-active');
                if (e.dataTransfer.files.length > 0) processDienstplanFile(e.dataTransfer.files[0]);
            });
        }

        function handleDienstplanUpload(event) {
            var file = event.target.files[0];
            if (file) processDienstplanFile(file);
            event.target.value = '';
        }

        function processDienstplanFile(file) {
            if (!window.XLSX) { alert('Excel-Bibliothek nicht geladen. Bitte Seite neu laden.'); return; }
            var validExt = ['.xlsx', '.xls', '.xlsm', '.csv'];
            var ext = file.name.substring(file.name.lastIndexOf('.')).toLowerCase();
            if (!validExt.includes(ext)) { alert('Bitte eine Excel-Datei (.xlsx, .xls, .xlsm) oder CSV hochladen.'); return; }

            var reader = new FileReader();
            reader.onload = function(e) {
                try {
                    var data = new Uint8Array(e.target.result);
                    dpWorkbook = XLSX.read(data, { type: 'array', cellStyles: true, cellDates: true });

                    var dpData = {
                        fileName: file.name,
                        uploadedAt: new Date().toISOString(),
                        uploadedBy: 'Upload',
                        base64: arrayBufferToBase64(e.target.result),
                        sheetNames: dpWorkbook.SheetNames
                    };
                    localStorage.setItem('mbwd_dienstplan', JSON.stringify(dpData));

                    // Cloud sync
                    (async function() {
                        try {
                            await cloudUpsert('app_kv', {
                                key: 'dienstplan_meta',
                                value: JSON.stringify({ fileName: dpData.fileName, uploadedAt: dpData.uploadedAt, uploadedBy: dpData.uploadedBy, sheetNames: dpData.sheetNames }),
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'key' });
                        } catch(e) { console.error('Meta sync error:', e); }
                        try {
                            await cloudUpsert('app_kv', {
                                key: 'dienstplan_data',
                                value: dpData.base64,
                                updated_at: new Date().toISOString()
                            }, { onConflict: 'key' });
                        } catch(e) { console.error('Data sync error:', e); }
                    })();

                    dpCurrentSheet = 0;
                    renderDienstplan();
                    updateDpPreview(dpData);
                    document.getElementById('dpDeleteBtn').style.display = '';
                } catch (err) {
                    console.error('Excel Parse Error:', err);
                    alert('Fehler beim Lesen der Excel-Datei: ' + err.message);
                }
            };
            reader.readAsArrayBuffer(file);
        }

        function arrayBufferToBase64(buffer) {
            var bytes = new Uint8Array(buffer);
            var binary = '';
            for (var i = 0; i < bytes.byteLength; i++) binary += String.fromCharCode(bytes[i]);
            return btoa(binary);
        }

        function base64ToArrayBuffer(base64) {
            var binary = atob(base64);
            var bytes = new Uint8Array(binary.length);
            for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
            return bytes.buffer;
        }

        function loadSavedDienstplan() {
            try {
                var saved = JSON.parse(localStorage.getItem('mbwd_dienstplan') || 'null');
                if (!saved || !saved.base64) {
                    var hint = 'Noch kein Dienstplan hochgeladen.<br>Excel-Datei oben hochladen oder reinziehen.';
                    if (isOnline && supabaseClient) hint += '<br><br><span style="font-size:11px;opacity:0.6;">☁️ Wird beim nächsten Cloud-Sync automatisch geladen...</span>';
                    document.getElementById('dpTableContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">' + hint + '</div>';
                    document.getElementById('dpDeleteBtn').style.display = 'none';
                    return;
                }
                var data = base64ToArrayBuffer(saved.base64);
                dpWorkbook = XLSX.read(new Uint8Array(data), { type: 'array', cellStyles: true, cellDates: true });
                dpCurrentSheet = 0;
                renderDienstplan();
                updateDpPreview(saved);
                document.getElementById('dpDeleteBtn').style.display = '';
            } catch (err) {
                console.warn('Dienstplan laden fehlgeschlagen:', err);
            }
        }

        function dpParseSheet(json) {
            var monthNamesLower = DP_MONTH_NAMES.map(function(m) { return m.toLowerCase(); });
            monthNamesLower.push('mar');
            var blocks = {};
            var employeeSet = {};
            var employeeOrder = [];

            var kwRows = [];
            json.forEach(function(row, rIdx) {
                for (var c = 0; c < Math.min(row.length, 10); c++) {
                    if (row[c] && String(row[c]).indexOf('KW') === 0) { kwRows.push(rIdx); break; }
                }
            });

            kwRows.forEach(function(kwRowIdx) {
                var dayRow = json[kwRowIdx + 1] || [];
                var wdayRow = json[kwRowIdx + 2] || [];
                var monthRow = json[kwRowIdx - 2] || [];
                var yearRow = json[kwRowIdx - 3] || [];

                var year = new Date().getFullYear();
                [yearRow, monthRow, json[kwRowIdx - 1] || []].forEach(function(row) {
                    row.forEach(function(cell) {
                        var n = parseInt(cell);
                        if (n >= 2024 && n <= 2030) year = n;
                    });
                });

                var monthPositions = [];
                monthRow.forEach(function(cell, cIdx) {
                    if (!cell) return;
                    var lower = String(cell).toLowerCase().trim();
                    var mIdx = monthNamesLower.indexOf(lower);
                    if (mIdx >= 0) {
                        if (mIdx === 12) mIdx = 2;
                        monthPositions.push({ month: mIdx, col: cIdx });
                    }
                });

                var currentMonth = monthPositions.length > 0 ? monthPositions[0].month : 0;
                var prevDay = 0;
                var dayMonthMap = {};

                for (var c = 2; c < dayRow.length; c++) {
                    var dayNum = parseInt(dayRow[c]);
                    if (isNaN(dayNum) || dayNum < 1 || dayNum > 31) continue;
                    monthPositions.forEach(function(mp) {
                        if (mp.col <= c && mp.col > (dayMonthMap[c-1] ? dayMonthMap[c-1].monthCol : -1)) currentMonth = mp.month;
                    });
                    if (dayNum < prevDay && dayNum === 1) currentMonth = (currentMonth + 1) % 12;
                    prevDay = dayNum;
                    var wday = wdayRow[c] ? String(wdayRow[c]).trim() : '';
                    dayMonthMap[c] = { day: dayNum, month: currentMonth, year: year, wday: wday, monthCol: c };
                }

                var empStartRow = kwRowIdx + 3;
                for (var r = empStartRow; r < json.length; r++) {
                    var row = json[r] || [];
                    var name = row[1] ? String(row[1]).trim() : '';
                    var hitNextBlock = false;
                    for (var cc = 0; cc < Math.min(row.length, 20); cc++) {
                        var cellVal = row[cc] ? String(row[cc]).toLowerCase().trim() : '';
                        if (monthNamesLower.indexOf(cellVal) >= 0) { hitNextBlock = true; break; }
                        var nVal = parseInt(row[cc]);
                        if (nVal >= 2024 && nVal <= 2030 && cc > 5) { hitNextBlock = true; break; }
                    }
                    if (hitNextBlock) break;
                    if (!name) continue;
                    if (name === 'Summe') break;

                    if (!employeeSet[name]) { employeeSet[name] = true; employeeOrder.push(name); }

                    Object.keys(dayMonthMap).forEach(function(colStr) {
                        var col = parseInt(colStr);
                        var dm = dayMonthMap[col];
                        var val = row[col] ? String(row[col]).trim() : '';
                        if (!val) return;
                        var monthKey = dm.month;
                        if (!blocks[monthKey]) blocks[monthKey] = { month: dm.month, year: dm.year, days: {}, wdays: {} };
                        if (!blocks[monthKey].days[dm.day]) blocks[monthKey].days[dm.day] = {};
                        blocks[monthKey].days[dm.day][name] = val;
                        blocks[monthKey].wdays[dm.day] = dm.wday;
                    });
                }
            });

            return { blocks: blocks, employees: employeeOrder };
        }

        function renderDienstplan() {
            if (!dpWorkbook) return;
            var tabsEl = document.getElementById('dpSheetTabs');
            var tableEl = document.getElementById('dpTableContainer');
            var zone = document.getElementById('dpDropZone');

            if (zone) { zone.style.padding = '16px 20px'; var kids = zone.querySelectorAll('div'); if (kids[0]) kids[0].style.fontSize = '24px'; if (kids[1]) kids[1].style.fontSize = '13px'; if (kids[2]) kids[2].style.fontSize = '11px'; }

            if (dpWorkbook.SheetNames.length > 1) {
                tabsEl.style.display = 'block';
                tabsEl.innerHTML = dpWorkbook.SheetNames.map(function(name, idx) {
                    return '<button class="dp-sheet-tab ' + (idx === dpCurrentSheet ? 'active' : '') + '" onclick="switchDpSheet(' + idx + ')">' + sanitizeHTML(name) + '</button>';
                }).join('');
            } else { tabsEl.style.display = 'none'; }

            var sheetName = dpWorkbook.SheetNames[dpCurrentSheet];

            if (sheetName === 'Dienstplan') {
                var sheet = dpWorkbook.Sheets[sheetName];
                var json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
                dpParsedData = dpParseSheet(json);
                if (dpViewMonth === null) dpViewMonth = new Date().getMonth();
                document.getElementById('dpMonthNav').style.display = 'flex';
                renderDpMonth();
                return;
            }

            document.getElementById('dpMonthNav').style.display = 'none';
            var sheet = dpWorkbook.Sheets[sheetName];
            var json = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
            if (json.length === 0) { tableEl.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text-muted);">Leeres Tabellenblatt</div>'; return; }

            var html = '<div class="dp-table-wrapper"><table class="dp-table">';
            json.forEach(function(row, rowIdx) {
                html += '<tr>';
                row.forEach(function(cell) {
                    var tag = rowIdx === 0 ? 'th' : 'td';
                    var val = cell;
                    if (typeof cell === 'number' && cell > 40000 && cell < 50000) {
                        try { var d = XLSX.SSF.parse_date_code(cell); val = (d.d<10?'0':'')+d.d+'.'+(d.m<10?'0':'')+d.m+'.'+d.y; } catch(e) {}
                    }
                    html += '<'+tag+'>'+sanitizeHTML(String(val))+'</'+tag+'>';
                });
                html += '</tr>';
            });
            html += '</table></div>';
            tableEl.innerHTML = html;
        }

        function renderDpMonth() {
            if (!dpParsedData) return;
            var tableEl = document.getElementById('dpTableContainer');
            var block = dpParsedData.blocks[dpViewMonth];
            var employees = dpParsedData.employees;
            var today = new Date();
            var todayDay = today.getDate();
            var todayMonth = today.getMonth();

            var yearLabel = block ? block.year : new Date().getFullYear();
            document.getElementById('dpMonthLabel').textContent = DP_MONTH_FULL[dpViewMonth] + ' ' + yearLabel;

            if (!block || Object.keys(block.days).length === 0) {
                tableEl.innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Keine Daten für ' + DP_MONTH_FULL[dpViewMonth] + '</div>';
                return;
            }

            var dayNums = Object.keys(block.days).map(Number).sort(function(a,b) { return a-b; });
            var html = '<div class="dp-table-wrapper"><table class="dp-table">';

            // KW header
            html += '<tr><th></th>';
            var kwStart = null, kwNum = null, kwCols = [];
            dayNums.forEach(function(day, idx) {
                var d = new Date(yearLabel, dpViewMonth, day);
                var kw = getISOWeek(d);
                if (kw !== kwNum) { if (kwNum !== null) kwCols.push({ kw: kwNum, span: idx - kwStart }); kwNum = kw; kwStart = idx; }
                if (idx === dayNums.length - 1) kwCols.push({ kw: kwNum, span: idx - kwStart + 1 });
            });
            kwCols.forEach(function(k) { html += '<th colspan="' + k.span + '" class="dp-kw-header">KW ' + k.kw + '</th>'; });
            html += '</tr>';

            // Day header
            html += '<tr><th>Name</th>';
            dayNums.forEach(function(day) {
                var wday = block.wdays[day] || '';
                var isToday = (dpViewMonth === todayMonth && day === todayDay);
                var isWeekend = (wday === 'Sa' || wday === 'So');
                var cls = isToday ? ' class="dp-today-col"' : (isWeekend ? ' class="dp-weekend"' : '');
                html += '<th' + cls + '>' + wday + '<br>' + day + '</th>';
            });
            html += '</tr>';

            // Employee rows
            employees.forEach(function(name) {
                html += '<tr><td>' + sanitizeHTML(name) + '</td>';
                dayNums.forEach(function(day) {
                    var shift = block.days[day] && block.days[day][name] ? block.days[day][name] : '';
                    var isToday = (dpViewMonth === todayMonth && day === todayDay);
                    var wday = block.wdays[day] || '';
                    var isWeekend = (wday === 'Sa' || wday === 'So');
                    var tdClass = isToday ? ' class="dp-today-col"' : (isWeekend && !shift ? ' class="dp-weekend"' : '');
                    if (shift) {
                        var shiftLower = shift.toLowerCase().trim();
                        var shiftClass = DP_SHIFT_CLASSES[shiftLower] || '';
                        html += '<td' + tdClass + '><span class="dp-shift' + (shiftClass ? ' dp-shift-' + shiftClass : '') + '">' + sanitizeHTML(shift) + '</span></td>';
                    } else { html += '<td' + tdClass + '></td>'; }
                });
                html += '</tr>';
            });
            html += '</table></div>';

            // Legend
            html += '<div class="dp-legend">';
            [['FI','fi','Früh I'],['FII','fii','Früh II'],['SI','si','Spät I'],['NI','ni','Nacht I'],
             ['DI','di','Diagnostik I'],['DII','dii','Diagnostik II'],['GT','gt','Gleittag'],['KT','kt','Koordination'],['KU','ku','Kuppenheim'],
             ['NST','nst','Nachtschichtausgleichstag'],['SD','sd','Sonderdienst'],['U','u','Urlaub'],
             ['EH','eh','Erste Hilfe'],['Fobi','fobi','Fortbildung']
            ].forEach(function(l) { html += '<div class="dp-legend-item"><span class="dp-shift dp-shift-' + l[1] + '">' + l[0] + '</span> ' + l[2] + '</div>'; });
            html += '</div>';
            tableEl.innerHTML = html;
        }

        function getISOWeek(d) {
            var date = new Date(d.getTime());
            date.setHours(0,0,0,0);
            date.setDate(date.getDate() + 3 - (date.getDay() + 6) % 7);
            var week1 = new Date(date.getFullYear(), 0, 4);
            return 1 + Math.round(((date.getTime() - week1.getTime()) / 86400000 - 3 + (week1.getDay() + 6) % 7) / 7);
        }

        function dpChangeMonth(delta) { dpViewMonth = ((dpViewMonth || 0) + delta + 12) % 12; renderDpMonth(); }
        function dpGoToToday() { dpViewMonth = new Date().getMonth(); renderDpMonth(); }
        function switchDpSheet(idx) { dpCurrentSheet = idx; dpViewMonth = null; renderDienstplan(); }

        function updateDpPreview(dpData) {
            var info = document.getElementById('dpUploadInfo');
            var d = new Date(dpData.uploadedAt);
            var dateStr = d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
            var timeStr = d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' });
            if (info) info.textContent = dpData.fileName + ' · ' + dateStr + ' ' + timeStr + ' von ' + (dpData.uploadedBy || 'Unbekannt');
        }

        function deleteDienstplan() {
            if (!confirm('Dienstplan wirklich löschen?')) return;
            localStorage.removeItem('mbwd_dienstplan');
            dpWorkbook = null; dpParsedData = null; dpViewMonth = null;
            document.getElementById('dpTableContainer').innerHTML = '<div style="text-align:center;padding:40px;color:var(--text-muted);">Noch kein Dienstplan hochgeladen.<br>Excel-Datei oben hochladen oder reinziehen.</div>';
            document.getElementById('dpMonthNav').style.display = 'none';
            document.getElementById('dpDeleteBtn').style.display = 'none';
            document.getElementById('dpUploadInfo').textContent = 'Kein Dienstplan hochgeladen';
            cloudUpsert('app_kv', { key: 'dienstplan_meta', value: JSON.stringify(null), updated_at: new Date().toISOString() }, { onConflict: 'key' });
            cloudUpsert('app_kv', { key: 'dienstplan_data', value: '', updated_at: new Date().toISOString() }, { onConflict: 'key' });
        }

        // ============ THEME ============

            var isLight = root.classList.toggle('light-mode');
            localStorage.setItem('mbwd_theme', isLight ? 'light' : 'dark');

            if (isLight) {
                icon.innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            } else {
                icon.innerHTML = '<path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4-.44-.06-.9-.1-1.36-.1z"/>';
            }
        }

        // ============ INIT ============
        async function initApp() {
            // Theme
            if (localStorage.getItem('mbwd_theme') === 'light') {
                document.documentElement.classList.add('light-mode');
                document.getElementById('themeIcon').innerHTML = '<path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5 5-2.24 5-5-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0-.39.39-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0 .39-.39.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.36c.39-.39.39-1.03 0-1.41-.39-.39-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z"/>';
            }

            // Offline
            if (!navigator.onLine) document.getElementById('offlineBanner').classList.add('show');

            // Supabase
            try {
                if (initSupabase()) {
                    await loadDienstplanFromCloud();
                    setupRealtime();
                }
            } catch (e) {
                console.error('Supabase Fehler:', e);
                updateSyncStatus('error');
            }

            // Drag & Drop
            setupDpDragDrop();

            // Lokal gespeicherten Dienstplan laden
            loadSavedDienstplan();
        }

        initApp();
    </script>
